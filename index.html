        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.25;
            z-index: -1;
            pointer-events: none;
        }

        body::before { width: 500px; height: 500px; background: var(--accent); top: -150px; right: -150px; }
        body::after { width: 400px; height: 400px; background: #92400e; bottom: -100px; left: -100px; }

        .container { max-width: 1000px; margin: 0 auto; }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            box-shadow: var(--glass-shadow);
        }

        .header { text-align: center; margin-bottom: 30px; padding: 30px 20px; }
        .header h1 {
            font-size: 2.2rem; font-weight: 800; margin-bottom: 12px;
            background: linear-gradient(135deg, #fff, var(--accent-light));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .header p { color: var(--text-secondary); font-size: 1.05rem; margin-bottom: 16px; }

        .source-link {
            display: inline-flex; align-items: center; gap: 6px; color: var(--accent);
            text-decoration: none; font-size: 0.9rem; font-weight: 500; padding: 8px 16px;
            border-radius: 20px; background: rgba(217, 119, 6, 0.1); border: 1px solid rgba(217, 119, 6, 0.2);
            transition: all 0.3s ease;
        }

        get currentVerbs() {
            if (!this.selectedCategory) return [];
            const category = this.categories.find(c => c.id === this.selectedCategory);
            return category ? category.verbs : [];
        },

        get currentVerb() {
            return this.currentVerbs[this.currentIndex];
        },

        get progress() {
            if (this.currentVerbs.length === 0) return 0;
            return ((this.currentIndex) / this.currentVerbs.length) * 100;
        },

        get accuracy() {
            if (this.totalAttempts === 0) return 0;
            return Math.round((this.correctCount / this.totalAttempts) * 100);
        },

        // Вычисляем плоский список всех глаголов для справочника
        get allVerbs() {
            return this.categories.flatMap(cat => 
                cat.verbs.map(v => ({ 
                    ...v, 
                    category: cat.name, 
                    categoryIcon: cat.icon 
                }))
            );
        },

        // Фильтруем список на основе поискового запроса
        get filteredVerbs() {
            if (!this.searchQuery.trim()) return this.allVerbs;
            const q = this.searchQuery.toLowerCase().trim();
            return this.allVerbs.filter(v => 
                v.phrase.toLowerCase().includes(q) || 
                v.translation.toLowerCase().includes(q) || 
                (v.synonyms && v.synonyms.some(s => s.toLowerCase().includes(q))) ||
                v.category.toLowerCase().includes(q)
            );
        },

        init() {
            this.categories.forEach(category => {
                category.verbs = category.verbs.sort(() => Math.random() - 0.5);
            });
        },

        selectCategory(categoryId) {
            this.selectedCategory = categoryId;
            this.currentIndex = 0;
            this.correctCount = 0;
            this.totalAttempts = 0;
            this.resetVerb();
        },

        resetVerb() {
            this.userAnswer = '';
            this.answerStatus = '';
            this.showHint = false;
            this.showExample = false;
        },

        checkAnswer() {
            if (!this.userAnswer.trim()) return;
            
            this.totalAttempts++;
            const userAnswer = this.userAnswer.trim().toLowerCase().replace(/\s+/g, ' ');
            
            const validAnswers = [this.currentVerb.translation];
            if (this.currentVerb.synonyms) {
                validAnswers.push(...this.currentVerb.synonyms);
            }
            
            let isCorrect = false;
            
            for (const valid of validAnswers) {
                const validNormalized = valid.toLowerCase().trim();
                const variants = validNormalized.split(/[,\/]| или /).map(v => v.trim());
                
                for (const variant of variants) {
                    if (userAnswer === variant || 
                        userAnswer.includes(variant) || 
                        variant.includes(userAnswer)) {
                        isCorrect = true;
                        break;
                    }
                }
                if (isCorrect) break;
            }

            if (isCorrect) {
                this.answerStatus = 'correct';
                this.correctCount++;
            } else {
                this.answerStatus = 'incorrect';
            }
        },

        nextVerb() {
            if (this.currentIndex < this.currentVerbs.length - 1) {
                this.currentIndex++;
                this.resetVerb();
                setTimeout(() => {
                    document.querySelector('.verb-input')?.focus();
                }, 100);
            } else {
                const finalAccuracy = this.accuracy;
                alert(`🎉 Категория завершена!\n\nВерно: ${this.correctCount} из ${this.currentVerbs.length}\nТочность: ${finalAccuracy}%`);
                this.selectedCategory = null;
                this.currentIndex = 0;
                this.correctCount = 0;
                this.totalAttempts = 0;
                this.resetVerb();
                this.currentVerbs.sort(() => Math.random() - 0.5);
            }
        }
    }
